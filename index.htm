<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style/style.css">
  <title>Random Jokes</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>Daily Jokes</h1>
            <div id="weather-info">Loading weather...</div>
        </header>
        
        <main>
            <div class="joke-card">
                <div id="joke-text">Loading joke...</div>
                
                <div class="rating">
                    <p>Rate this joke:</p>
                    <div class="score-buttons">
                        <button id="score-1" class="score-btn">😞</button>
                        <button id="score-2" class="score-btn">😐</button>
                        <button id="score-3" class="score-btn">😊</button>
                    </div>
                </div>
                
                <div class="actions">
                    <button id="next-joke-btn">Next Joke</button>
                    <button id="show-report-btn">Show Report</button>
                </div>
            </div>
        </main>
    </div>

  <script src="./src/scripts/api.ts"></script>
  <script src="./src/scripts/main.ts"></script>
  <script src="./src/scripts/events.ts"></script>
  <script src="./src/scripts/dom.ts"></script>
</body>

</html>
