<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style/style.css">
  <title>Random Jokes</title>
</head>

<body>
  <main class="main container-sm">
    <div class="" id="text1">
      <span class=""> Good morning! Let's start ther day with a smile </span>
    </div>

    <p class="card-text text-center" id="joke"> Loading joke... </p>

    <div id="buttons-score" class="text-center">
      <button data-score="1" class="score-btn" data-score">😓</button>
      <button data-score="2" class="score-btn" data-score">😐</button>
      <button data-score="3" class="score-btn" data-score">😆</button>
    </div>

    <button id="next-joke" class="btnNext"> Next Joke ➡️</button>

    <section id="weather-container" class="">
       <div class="align-self-start" id="weather">
            <img src="" alt="weather icon">
            <span class="temperature"></span>
        </div>

      <div>
        <p id="weather" class=""> Loading time... </p>
      </div>
    </section>
  </main>

  <script src="./src/scripts/api.ts"></script>
  <script src="./src/scripts/main.ts"></script>
  <script src="./src/scripts/events.ts"></script>
</body>

</html>
